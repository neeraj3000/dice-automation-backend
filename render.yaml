services:
  - type: web
    name: dice-automation-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: MONGODB_URL
        sync: false
      - key: DATABASE_NAME
        value: dice_automation
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: BROWSER_MODE
        value: server
      - key: HEADLESS
        value: "true"
      - key: BROWSER_DATA_DIR
        value: /app/data/browser_profiles
      - key: SESSION_ENCRYPTION_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "*"      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_PLAN_CACHE_SECONDS
        value: "300"
      - key: FRONTEND_URL
        sync: false
      - key: TRIAL_DAYS
        value: "7"
      - key: TRIAL_APPLICATION_LIMIT
        value: "25"
      - key: TRIAL_SEARCH_PROFILE_LIMIT
        value: "1"
      - key: BILLING_TIMEZONE
        value: America/New_York
